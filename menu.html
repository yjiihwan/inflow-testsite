<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>테스트 카페 · 메뉴</title>
<script async src="https://inflow-web-staging.up.railway.app/t.js" data-site="yrBrUzjgUHFm"></script>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#222;background:#fffaf3}
header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0}
header b{font-size:18px} nav a{margin-left:14px;color:#a0522d;text-decoration:none}
.hero{padding:60px 20px;text-align:center;background:#f6e7d3}
.hero h1{font-size:30px;margin:0 0 10px}.hero p{color:#555}
.btn-order{display:inline-block;margin-top:18px;padding:14px 28px;background:#c0602b;color:#fff;border-radius:10px;text-decoration:none;font-weight:700}
section{max-width:860px;margin:0 auto;padding:40px 20px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.item{background:#fff;border:1px solid #eee;border-radius:12px;padding:20px;min-height:160px}
.item button{margin-top:12px;padding:8px 14px;border:1px solid #c0602b;background:#fff;color:#c0602b;border-radius:8px}
.tall{height:700px;background:linear-gradient(#fffaf3,#f3e3cf);display:grid;place-items:center;color:#888}
footer{padding:40px 20px;text-align:center;color:#888;background:#fff}
#coupon{padding:12px 22px;background:#222;color:#fff;border:0;border-radius:10px}
</style></head><body>
<header><b>☕ 테스트 카페</b><nav><a href="menu.html" id="nav-menu">메뉴</a><a href="#store" id="nav-store">매장</a></nav></header>
<div class="hero"><h1>전체 메뉴</h1><p>밤 라떼 · 고구마 크림 · 단호박 수프</p><a class="btn-order" href="#order" id="order-btn">지금 주문하기</a></div>
<section><h2>신메뉴</h2><div class="menu">
<div class="item"><h3>밤 라떼</h3><p>국산 밤을 갈아 넣은 라떼</p><button id="add-chestnut">담기</button></div>
<div class="item"><h3>고구마 크림</h3><p>달콤한 고구마 크림 음료</p><button id="add-potato">담기</button></div>
<div class="item"><h3>단호박 수프</h3><p>따뜻한 한 끼</p><button id="add-soup">담기</button></div>
</div></section>
<div class="tall">스크롤 깊이 확인용 영역</div>
<section id="store"><h2>매장 안내</h2><p>이 페이지는 유입분석 서비스 검증용 가짜 사이트입니다.</p><button id="coupon">쿠폰 받기</button></section>
<footer>테스트 카페 (가상) · 유입분석 검증용</footer>
</body></html>
